<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WoahGen Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background: #050a14; }

.card {
  background: #0b1220;
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 16px;
}

.sidebar { background: #070d18; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb {
  background: #7c3aed;
  border-radius: 10px;
}
</style>
</head>

<body class="text-white flex">

<!-- SIDEBAR -->
<div class="sidebar w-64 h-screen p-5 flex flex-col overflow-y-auto">

<h1 class="text-xl font-bold mb-6 text-purple-400">WoahGen</h1>

<button onclick="showPage('dashboard')" class="p-2 bg-purple-600 rounded mb-1">Dashboard</button>
<button onclick="showPage('generator')" class="p-2 hover:bg-[#111827] rounded">Generator</button>
<button onclick="showPage('redeem')" class="p-2 hover:bg-[#111827] rounded">Redeem Key</button>

<button id="adminStockBtn" onclick="showPage('stock')" class="p-2 hover:bg-[#111827] rounded hidden">Stock</button>

<div class="mt-auto">
<button onclick="logout()" class="bg-red-500 w-full p-2 rounded mt-6">Logout</button>
</div>

</div>

<!-- MAIN -->
<div class="flex-1 p-6 overflow-y-auto h-screen">

<!-- DASHBOARD -->
<div id="dashboardPage">
<h1 class="text-3xl mb-6">Dashboard</h1>
</div>

<!-- GENERATOR -->
<div id="generatorPage" class="hidden">

<h1 class="text-3xl mb-6">Account Generator</h1>

<div class="card p-6 text-center">

<!-- LOCKED -->
<div id="lockedBox">

<p class="mb-4 text-gray-400">Generator Locked</p>

<input id="keyInput" placeholder="Enter Key"
class="p-3 bg-black rounded mb-3 w-full">

<button onclick="redeemKey()" class="bg-purple-600 px-6 py-2 rounded">
Unlock
</button>

</div>

<!-- UNLOCKED -->
<div id="genBox" class="hidden">

<button onclick="generate()" class="bg-green-500 px-6 py-3 rounded">
Generate Account
</button>

<p id="output" class="mt-4 text-green-400"></p>

</div>

</div>

</div>

<!-- STOCK -->
<div id="stockPage" class="hidden">

<h1 class="text-3xl mb-6">Stock</h1>

<div class="card p-6">

<textarea id="stockInput"
class="w-full h-40 bg-black p-3 rounded mb-4"
placeholder="user:pass"></textarea>

<button onclick="addStock()" class="bg-purple-600 px-6 py-2 rounded">
Add Stock
</button>

</div>

</div>

</div>

<script>

// ADMIN BUTTON
if (localStorage.getItem("admin") === "true") {
  document.getElementById("adminStockBtn").classList.remove("hidden");
}

// PAGE SWITCH FIX
function showPage(page) {
  const pages = ["dashboardPage","generatorPage","stockPage"];

  pages.forEach(id => {
    document.getElementById(id).classList.add("hidden");
  });

  document.getElementById(page + "Page").classList.remove("hidden");
}

// KEY SYSTEM
function redeemKey() {
  let key = document.getElementById("keyInput").value;

  if (key === "FREEKEY") {
    localStorage.setItem("unlocked", "true");

    document.getElementById("lockedBox").classList.add("hidden");
    document.getElementById("genBox").classList.remove("hidden");

  } else {
    alert("Invalid key");
  }
}

// CHECK IF ALREADY UNLOCKED
if (localStorage.getItem("unlocked") === "true") {
  setTimeout(() => {
    if (document.getElementById("lockedBox")) {
      document.getElementById("lockedBox").classList.add("hidden");
      document.getElementById("genBox").classList.remove("hidden");
    }
  }, 100);
}

// GENERATOR
function generate() {
  let stock = localStorage.getItem("stock");

  if (!stock) return alert("No stock");

  let list = stock.split("\n");
  let acc = list.shift();

  localStorage.setItem("stock", list.join("\n"));

  document.getElementById("output").innerText = acc;
}

// ADD STOCK
function addStock() {
  let input = document.getElementById("stockInput").value;
  localStorage.setItem("stock", input);
  alert("Stock added!");
}

// LOGOUT
function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

</script>

</body>
</html>
