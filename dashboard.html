<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WoahGen Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: #050a14;
}

.card {
  background: #0b1220;
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 16px;
}

.sidebar {
  background: #070d18;
}

::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-thumb {
  background: #7c3aed;
  border-radius: 10px;
}
</style>
</head>

<body class="text-white flex">

<!-- SIDEBAR -->
<div class="sidebar w-64 h-screen p-5 flex flex-col overflow-y-auto">

<h1 class="text-xl font-bold mb-6 text-purple-400">WoahGen</h1>

<p class="text-xs text-gray-400 mb-2">OVERVIEW</p>
<button onclick="showPage('dashboard')" class="p-2 w-full text-left bg-purple-600 rounded mb-1">Dashboard</button>
<button onclick="showPage('redeem')" class="p-2 w-full text-left hover:bg-[#111827] rounded">Redeem Key</button>

<p class="text-xs text-gray-400 mt-4 mb-2">SERVICES</p>
<button onclick="showPage('generator')" class="p-2 w-full text-left hover:bg-[#111827] rounded">Generator</button>
<button class="p-2 w-full text-left opacity-50">Botting</button>
<button class="p-2 w-full text-left opacity-50">Email</button>
<button class="p-2 w-full text-left opacity-50">History</button>

<p class="text-xs text-gray-400 mt-4 mb-2">SHOP</p>
<button onclick="showPage('shop')" class="p-2 w-full text-left hover:bg-[#111827] rounded">Shop</button>
<button onclick="showPage('tokens')" class="p-2 w-full text-left hover:bg-[#111827] rounded">Tokens</button>

<p class="text-xs text-gray-400 mt-4 mb-2">ADMIN</p>
<button id="adminStockBtn" onclick="showPage('stock')" class="p-2 w-full text-left hover:bg-[#111827] rounded hidden">Stock</button>

<div class="mt-auto">
<button onclick="logout()" class="bg-red-500 w-full p-2 rounded mt-6">Logout</button>
</div>

</div>

<!-- MAIN -->
<div class="flex-1 p-6 overflow-y-auto h-screen">

<!-- DASHBOARD -->
<div id="dashboardPage">

<h1 class="text-3xl mb-6">Dashboard</h1>

<div class="grid grid-cols-4 gap-4 mb-6">

<div class="card p-4">
<p class="text-gray-400">Total Generated</p>
<h2 class="text-2xl">0</h2>
</div>

<div class="card p-4">
<p class="text-gray-400">This Month</p>
<h2>0</h2>
</div>

<div class="card p-4">
<p class="text-gray-400">This Week</p>
<h2>0</h2>
</div>

<div class="card p-4">
<p class="text-gray-400">Today</p>
<h2>0</h2>
</div>

</div>

</div>

<!-- GENERATOR -->
<div id="generatorPage" class="hidden">

<h1 class="text-3xl mb-6">Account Generator</h1>

<div class="grid grid-cols-2 gap-6">

<!-- LEFT -->
<div class="card p-6">

<h2 class="mb-4">Generate Account</h2>

<select id="type" class="w-full p-3 bg-black rounded mb-4">
<option>Normal</option>
<option>Unchecked</option>
<option>HQ</option>
</select>

<button onclick="generate()" class="w-full bg-purple-600 p-3 rounded">
Generate
</button>

</div>

<!-- RIGHT -->
<div class="card p-6">

<h2 class="mb-4">Account Output</h2>
<p id="output" class="text-green-400">None yet</p>

</div>

</div>

</div>

<!-- STOCK -->
<div id="stockPage" class="hidden">

<h1 class="text-3xl mb-6">Stock</h1>

<div class="card p-6">

<textarea id="stockInput" class="w-full h-40 bg-black p-3 rounded mb-4"
placeholder="user:pass"></textarea>

<button onclick="addStock()" class="bg-purple-600 px-6 py-2 rounded">
Add Stock
</button>

</div>

</div>

</div>

<script>

// ADMIN SHOW
if (localStorage.getItem("admin") === "true") {
  document.getElementById("adminStockBtn").classList.remove("hidden");
}

// PAGE SWITCH
function showPage(page) {
  ["dashboard","generator","stock"].forEach(p=>{
    document.getElementById(p+"Page").classList.add("hidden");
  });
  document.getElementById(page+"Page").classList.remove("hidden");
}

// GENERATOR
function generate() {
  let stock = localStorage.getItem("stock");

  if (!stock) {
    alert("No stock");
    return;
  }

  let list = stock.split("\n");
  let acc = list.shift();

  localStorage.setItem("stock", list.join("\n"));

  document.getElementById("output").innerText = acc;
}

// ADD STOCK
function addStock() {
  let input = document.getElementById("stockInput").value;
  localStorage.setItem("stock", input);
  alert("Stock added!");
}

// LOGOUT
function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

</script>

</body>
</html>
