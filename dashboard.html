<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WoahGen</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: #070b14;
}
.card {
  background: #0f172a;
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 16px;
}
</style>
</head>

<body class="text-white flex">

<!-- SIDEBAR -->
<div class="w-64 h-screen bg-[#0b0f1a] p-5 flex flex-col border-r border-white/5">

<h1 class="text-xl font-bold mb-6 text-purple-400">WoahGen</h1>

<div class="space-y-2">

<button onclick="showPage('dashboard')" class="w-full text-left p-2 bg-purple-600 rounded">Dashboard</button>
<button onclick="showPage('generator')" class="w-full text-left p-2 hover:bg-[#111827] rounded">Generator</button>
<button onclick="showPage('keys')" class="w-full text-left p-2 hover:bg-[#111827] rounded">Keys</button>

<button id="stockBtn" onclick="showPage('stock')" class="w-full text-left p-2 hover:bg-[#111827] rounded hidden">Stock</button>

<button onclick="showPage('settings')" class="w-full text-left p-2 hover:bg-[#111827] rounded">Settings</button>

</div>

<div class="mt-auto">
<button onclick="logout()" class="bg-red-500 w-full p-2 rounded mt-6">Logout</button>
</div>

</div>

<!-- MAIN -->
<div class="flex-1">

<!-- TOP BAR -->
<div class="flex justify-end items-center p-4 border-b border-white/5">
<div class="bg-[#111827] px-4 py-2 rounded-lg flex items-center gap-4">
<span class="text-green-400">$0.00</span>
</div>
</div>

<div class="p-8">

<!-- DASHBOARD -->
<div id="dashboardPage">

<h1 class="text-3xl mb-6">Dashboard</h1>

<div class="grid grid-cols-4 gap-4 mb-8">

<div class="card p-4">
<p class="text-gray-400">Total Generated</p>
<h2 id="totalGen" class="text-2xl">0</h2>
</div>

<div class="card p-4">
<p class="text-gray-400">This Month</p>
<h2>0</h2>
</div>

<div class="card p-4">
<p class="text-gray-400">This Week</p>
<h2>0</h2>
</div>

<div class="card p-4">
<p class="text-gray-400">Today</p>
<h2>0</h2>
</div>

</div>

<div class="card p-6">
<h2>Subscription</h2>
<p id="subStatus" class="text-gray-400">NO PLAN</p>
</div>

</div>

<!-- GENERATOR -->
<div id="generatorPage" class="hidden">

<h1 class="text-3xl mb-6">Account Generator</h1>

<div class="card p-10 text-center">

<div id="lockedBox">
<p class="mb-4">Account stock is locked</p>

<input id="keyInput2" placeholder="Enter key"
class="p-3 bg-black rounded mb-3">

<br>

<button onclick="redeemKey()" class="bg-purple-600 px-6 py-2 rounded">
Redeem Key
</button>
</div>

<div id="genBox" class="hidden">
<button onclick="generateAccount()" class="bg-green-500 px-6 py-3 rounded">
Generate
</button>

<p id="result" class="mt-4 text-green-400"></p>
</div>

</div>

</div>

<!-- KEYS (ADMIN) -->
<div id="keysPage" class="hidden">

<h1 class="text-3xl mb-6">Key Generator</h1>

<div class="card p-6">
<button onclick="generateKey()" class="bg-purple-600 p-3 rounded">
Generate Key
</button>
</div>

</div>

<!-- STOCK (ADMIN) -->
<div id="stockPage" class="hidden">

<h1 class="text-3xl mb-6 text-purple-400">Stock Panel</h1>

<div class="card p-6">

<textarea id="stock"
placeholder="user:pass per line"
class="w-full h-40 bg-black p-4 rounded"></textarea>

<button onclick="saveStock()" class="bg-purple-500 p-3 mt-3 rounded">
Save Stock
</button>

</div>

</div>

<!-- SETTINGS -->
<div id="settingsPage" class="hidden">

<h1 class="text-3xl mb-6">Settings</h1>

<div class="card p-6 w-[400px]">

<input id="oldPass" placeholder="Current Password" class="w-full p-3 mb-3 bg-black rounded">
<input id="newPass" placeholder="New Password" class="w-full p-3 mb-3 bg-black rounded">

<button onclick="changePassword()" class="bg-green-500 w-full p-3 rounded">
Update Password
</button>

</div>

</div>

</div>

</div>

<script>

// AUTH
let user = localStorage.getItem("loggedIn");
let admin = localStorage.getItem("admin");

if (!user && admin !== "true") {
  window.location.href = "login.html";
}

// SHOW ADMIN BUTTON (SAFE)
window.onload = () => {
  let stockBtn = document.getElementById("stockBtn");

  if (admin === "true" && stockBtn) {
    stockBtn.classList.remove("hidden");
  }

  // LOAD STATS SAFELY
  let totalGen = document.getElementById("totalGen");
  if (totalGen) {
    totalGen.innerText = localStorage.getItem("generated") || 0;
  }
};

// PAGE SWITCH
function showPage(page) {
  ["dashboard","generator","keys","stock","settings"].forEach(p=>{
    let el = document.getElementById(p+"Page");
    if (el) el.classList.add("hidden");
  });

  document.getElementById(page+"Page").classList.remove("hidden");
}

// ================= KEY SYSTEM =================

function generateKey() {
  let key = "WOAH-" + Math.random().toString(36).substring(2,10).toUpperCase();

  let keys = JSON.parse(localStorage.getItem("keys") || "[]");

  keys.push({ code: key, used: false });

  localStorage.setItem("keys", JSON.stringify(keys));

  alert("Key: " + key);
}

function redeemKey() {
  let input = document.getElementById("keyInput2").value;

  let keys = JSON.parse(localStorage.getItem("keys") || "[]");

  let found = keys.find(k => k.code === input && !k.used);

  if (found) {
    found.used = true;
    localStorage.setItem("keys", JSON.stringify(keys));

    localStorage.setItem("unlocked", "true");

    document.getElementById("lockedBox").classList.add("hidden");
    document.getElementById("genBox").classList.remove("hidden");

    alert("Unlocked!");
  } else {
    alert("Invalid or used key");
  }
}

// ================= STOCK =================

function saveStock() {
  let stock = document.getElementById("stock").value;
  localStorage.setItem("stock", stock);
  alert("Stock saved");
}

// ================= GENERATOR =================

function generateAccount() {

  if (localStorage.getItem("unlocked") !== "true") {
    return alert("Redeem key first");
  }

  let stock = localStorage.getItem("stock");

  if (!stock || stock.trim() === "") {
    return alert("No stock");
  }

  let lines = stock.split("\n");
  let acc = lines.shift();

  localStorage.setItem("stock", lines.join("\n"));

  document.getElementById("result").innerText = acc;

  let total = parseInt(localStorage.getItem("generated") || "0");
  total++;

  localStorage.setItem("generated", total);
  document.getElementById("totalGen").innerText = total;
}


// ================= PASSWORD =================

function changePassword() {
  let oldPass = document.getElementById("oldPass").value;
  let newPass = document.getElementById("newPass").value;

  if (admin === "true") {
    let saved = localStorage.getItem("adminPass");

    if (oldPass === saved) {
      localStorage.setItem("adminPass", newPass);
      alert("Admin password updated");
    } else {
      alert("Wrong password");
    }
  } else {
    let email = localStorage.getItem("loggedIn");
    let user = JSON.parse(localStorage.getItem(email));

    if (user.password === oldPass) {
      user.password = newPass;
      localStorage.setItem(email, JSON.stringify(user));
      alert("Password updated");
    } else {
      alert("Wrong password");
    }
  }
}

// LOGOUT
function logout() {
  localStorage.removeItem("loggedIn");
  localStorage.removeItem("admin");
  window.location.href = "login.html";
}

</script>

</body>
</html>
