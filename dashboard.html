<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WoahGen</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: #02040a;
}

/* sidebar */
.sidebar {
  background: #050816;
  border-right: 1px solid rgba(255,255,255,0.05);
}

/* logo */
.logo {
  font-weight: 800;
  font-size: 20px;
}

/* card */
.card {
  background: #0b1220;
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 14px;
}

/* nav */
.nav-btn {
  padding: 10px;
  border-radius: 8px;
  transition: .2s;
}
.nav-btn:hover {
  background: rgba(255,255,255,0.05);
}
.nav-active {
  background: #1a1f35;
}

/* scrollbar */
::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-thumb {
  background: #6366f1;
}
</style>
</head>

<body class="text-white flex">

<!-- SIDEBAR -->
<div class="sidebar w-64 h-screen flex flex-col overflow-y-auto">

<!-- TOP -->
<div class="p-4 border-b border-white/5">
  <h1 class="logo">WoahGen</h1>
</div>

<!-- NAV -->
<div class="p-4 text-sm">

<p class="text-gray-500 mb-2">OVERVIEW</p>
<div class="space-y-1 mb-4">
  <button onclick="showPage('dashboard')" class="nav-btn nav-active w-full text-left">Dashboard</button>
  <button class="nav-btn w-full text-left">Redeem Key</button>
  <button class="nav-btn w-full text-left">Referrals</button>
</div>

<p class="text-gray-500 mb-2">SERVICES</p>
<div class="space-y-1 mb-4">
  <button onclick="showPage('generator')" class="nav-btn w-full text-left">Generator</button>
  <button class="nav-btn">Botting</button>
  <button class="nav-btn">Email</button>
  <button class="nav-btn">History</button>
</div>

<p class="text-gray-500 mb-2">ADMIN</p>
<div class="space-y-1 mb-4">
  <button onclick="showPage('keys')" class="nav-btn">Keys</button>
  <button id="stockBtn" onclick="showPage('stock')" class="nav-btn hidden">Stock</button>
</div>

<p class="text-gray-500 mb-2">SETTINGS</p>
<div class="space-y-1 mb-4">
  <button onclick="showPage('settings')" class="nav-btn">Settings</button>
</div>

</div>

<!-- USER -->
<div class="mt-auto p-4 border-t border-white/5 text-sm">
  <p>Account</p>
  <p class="text-gray-400">No Plan</p>
  <button onclick="logout()" class="bg-red-500 w-full mt-3 p-2 rounded">
    Logout
  </button>
</div>

</div>

<!-- MAIN -->
<div class="flex-1">

<!-- TOP BAR -->
<div class="flex justify-between items-center p-4 border-b border-white/5">

<h1 class="text-lg font-semibold">Dashboard</h1>

<div class="flex gap-3">
  <div class="card px-4 py-2">$0.00</div>
  <button class="bg-indigo-600 px-4 py-2 rounded">Redeem Key</button>
</div>

</div>

<div class="p-6">

<!-- DASHBOARD -->
<div id="dashboardPage">

<div class="grid grid-cols-4 gap-4 mb-6">

<div class="card p-4">
<p class="text-gray-400">Total Generated</p>
<h2 id="totalGen" class="text-2xl">0</h2>
</div>

<div class="card p-4"><p>This Month</p><h2>0</h2></div>
<div class="card p-4"><p>This Week</p><h2>0</h2></div>
<div class="card p-4"><p>Today</p><h2>0</h2></div>

</div>

<div class="card p-6">
<p class="text-gray-400">Subscription</p>
<p>NO PLAN</p>
</div>

</div>

<!-- GENERATOR -->
<div id="generatorPage" class="hidden">

<h1 class="text-xl mb-4">Account Generator</h1>

<div class="card p-8 text-center">

<div id="lockedBox">
<p class="mb-3">Stock locked</p>

<input id="keyInput2" class="p-2 bg-black rounded mb-3">

<button onclick="redeemKey()" class="bg-indigo-600 px-4 py-2 rounded">
Redeem
</button>
</div>

<div id="genBox" class="hidden">
<button onclick="generateAccount()" class="bg-green-500 px-4 py-2 rounded">
Generate
</button>

<p id="result" class="mt-3"></p>
</div>

</div>

</div>

<!-- KEYS -->
<div id="keysPage" class="hidden">
<button onclick="generateKey()" class="bg-purple-600 p-3 rounded">
Generate Key
</button>
</div>

<!-- STOCK -->
<div id="stockPage" class="hidden">
<textarea id="stock" class="w-full h-40 bg-black p-4"></textarea>
<button onclick="saveStock()" class="bg-purple-500 p-3 mt-3">Save</button>
</div>

<!-- SETTINGS -->
<div id="settingsPage" class="hidden">

<input id="oldPass" placeholder="Old" class="p-2 bg-black mb-2">
<input id="newPass" placeholder="New" class="p-2 bg-black mb-2">

<button onclick="changePassword()" class="bg-green-500 p-2">
Update
</button>

</div>

</div>

</div>

<script>
// AUTH
let user = localStorage.getItem("loggedIn");
let admin = localStorage.getItem("admin");

if (!user && admin !== "true") {
  window.location.href = "login.html";
}

window.onload = () => {
  if (admin === "true") {
    document.getElementById("stockBtn").classList.remove("hidden");
  }

  document.getElementById("totalGen").innerText =
    localStorage.getItem("generated") || 0;
};

// NAV
function showPage(page) {
  ["dashboard","generator","keys","stock","settings"].forEach(p=>{
    let el = document.getElementById(p+"Page");
    if (el) el.classList.add("hidden");
  });

  document.getElementById(page+"Page").classList.remove("hidden");
}

// KEYS
function generateKey() {
  let key = "WOAH-" + Math.random().toString(36).substring(2,10).toUpperCase();
  let keys = JSON.parse(localStorage.getItem("keys") || "[]");
  keys.push({ code: key, used: false });
  localStorage.setItem("keys", JSON.stringify(keys));
  alert(key);
}

function redeemKey() {
  let input = document.getElementById("keyInput2").value;
  let keys = JSON.parse(localStorage.getItem("keys") || "[]");

  let found = keys.find(k => k.code === input && !k.used);

  if (found) {
    found.used = true;
    localStorage.setItem("keys", JSON.stringify(keys));
    localStorage.setItem("unlocked", "true");

    document.getElementById("lockedBox").classList.add("hidden");
    document.getElementById("genBox").classList.remove("hidden");
  } else alert("Invalid key");
}

// STOCK
function saveStock() {
  localStorage.setItem("stock", document.getElementById("stock").value);
}

// GENERATE
function generateAccount() {
  let stock = localStorage.getItem("stock");
  if (!stock) return alert("No stock");

  let lines = stock.split("\n");
  let acc = lines.shift();

  localStorage.setItem("stock", lines.join("\n"));
  document.getElementById("result").innerText = acc;

  let total = parseInt(localStorage.getItem("generated") || "0");
  total++;
  localStorage.setItem("generated", total);
  document.getElementById("totalGen").innerText = total;
}

// PASSWORD
function changePassword() {
  let newPass = document.getElementById("newPass").value;
  localStorage.setItem("adminPass", newPass);
}

// LOGOUT
function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}
</script>

</body>
</html>
