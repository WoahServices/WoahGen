<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WoahGen</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: radial-gradient(circle at top, #05070f, #02040a);
}

/* sidebar */
.sidebar {
  background: linear-gradient(180deg, #0b0f1a, #070b14);
  border-right: 1px solid rgba(255,255,255,0.05);
}

/* logo */
.logo {
  background: linear-gradient(90deg, #8b5cf6, #00ffcc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 900;
  font-size: 22px;
}

/* cards */
.card {
  background: linear-gradient(145deg, #0f172a, #020617);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 18px;
  box-shadow: 0 0 25px rgba(0,255,200,0.05);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 40px rgba(0,255,200,0.15);
}

/* nav */
.nav-btn {
  padding: 10px;
  border-radius: 10px;
  transition: 0.2s;
}

.nav-btn:hover {
  background: rgba(139,92,246,0.2);
}

.nav-active {
  background: linear-gradient(90deg, #8b5cf6, #6366f1);
}

/* glow */
.glow {
  text-shadow: 0 0 10px #00ffcc;
}
</style>
</head>

<body class="text-white flex">

<!-- SIDEBAR -->
<div class="sidebar w-64 h-screen p-5 flex flex-col">

<h1 class="logo mb-6">WoahGen</h1>

<div class="space-y-2">

<button onclick="showPage('dashboard')" class="nav-btn nav-active w-full text-left">🏠 Dashboard</button>
<button onclick="showPage('generator')" class="nav-btn w-full text-left">⚡ Generator</button>
<button onclick="showPage('keys')" class="nav-btn w-full text-left">🔑 Keys</button>

<button id="stockBtn" onclick="showPage('stock')" class="nav-btn w-full text-left hidden">📦 Stock</button>

<button onclick="showPage('settings')" class="nav-btn w-full text-left">⚙️ Settings</button>

</div>

<div class="mt-auto">
<button onclick="logout()" class="bg-red-500 w-full p-2 rounded mt-6">Logout</button>
</div>

</div>

<!-- MAIN -->
<div class="flex-1">

<!-- TOP BAR -->
<div class="flex justify-end items-center p-4 border-b border-white/5">

<div class="flex items-center gap-4">

<div class="card px-4 py-2 flex items-center gap-2">
💰 <span class="text-green-400">$0.00</span>
</div>

<button class="bg-gradient-to-r from-purple-500 to-indigo-500 px-4 py-2 rounded-lg">
Redeem Key
</button>

</div>

</div>

<div class="p-8">

<!-- DASHBOARD -->
<div id="dashboardPage">

<h1 class="text-3xl mb-6 glow">Dashboard</h1>

<div class="grid grid-cols-4 gap-4 mb-8">

<div class="card p-5">
<p class="text-gray-400">Total Generated</p>
<h2 id="totalGen" class="text-3xl mt-2">0</h2>
</div>

<div class="card p-5">
<p class="text-gray-400">This Month</p>
<h2 class="text-3xl mt-2">0</h2>
</div>

<div class="card p-5">
<p class="text-gray-400">This Week</p>
<h2 class="text-3xl mt-2">0</h2>
</div>

<div class="card p-5">
<p class="text-gray-400">Today</p>
<h2 class="text-3xl mt-2">0</h2>
</div>

</div>

<div class="card p-6">
<h2 class="text-lg">Subscription</h2>
<p id="subStatus" class="text-gray-400 mt-2">NO PLAN</p>
</div>

</div>

<!-- GENERATOR -->
<div id="generatorPage" class="hidden">

<h1 class="text-3xl mb-6 glow">Account Generator</h1>

<div class="card p-10 text-center">

<div id="lockedBox">
<p class="mb-4 text-gray-400">Account stock is locked</p>

<input id="keyInput2" placeholder="Enter key"
class="p-3 bg-black rounded mb-3">

<br>

<button onclick="redeemKey()" class="bg-purple-600 px-6 py-2 rounded">
Redeem Key
</button>
</div>

<div id="genBox" class="hidden">
<button onclick="generateAccount()" class="bg-green-500 px-6 py-3 rounded">
Generate
</button>

<p id="result" class="mt-4 text-green-400"></p>
</div>

</div>

</div>

<!-- KEYS -->
<div id="keysPage" class="hidden">

<h1 class="text-3xl mb-6 glow">Key Generator</h1>

<div class="card p-6">
<button onclick="generateKey()" class="bg-purple-600 p-3 rounded">
Generate Key
</button>
</div>

</div>

<!-- STOCK -->
<div id="stockPage" class="hidden">

<h1 class="text-3xl mb-6 text-purple-400">Stock Panel</h1>

<div class="card p-6">

<textarea id="stock"
placeholder="user:pass per line"
class="w-full h-40 bg-black p-4 rounded"></textarea>

<button onclick="saveStock()" class="bg-purple-500 p-3 mt-3 rounded">
Save Stock
</button>

</div>

</div>

<!-- SETTINGS -->
<div id="settingsPage" class="hidden">

<h1 class="text-3xl mb-6 glow">Settings</h1>

<div class="card p-6 w-[400px]">

<input id="oldPass" placeholder="Current Password" class="w-full p-3 mb-3 bg-black rounded">
<input id="newPass" placeholder="New Password" class="w-full p-3 mb-3 bg-black rounded">

<button onclick="changePassword()" class="bg-green-500 w-full p-3 rounded">
Update Password
</button>

</div>

</div>

</div>

</div>

<script>
let user = localStorage.getItem("loggedIn");
let admin = localStorage.getItem("admin");

if (!user && admin !== "true") {
  window.location.href = "login.html";
}

window.onload = () => {
  let stockBtn = document.getElementById("stockBtn");

  if (admin === "true" && stockBtn) {
    stockBtn.classList.remove("hidden");
  }

  let totalGen = document.getElementById("totalGen");
  if (totalGen) {
    totalGen.innerText = localStorage.getItem("generated") || 0;
  }
};

function showPage(page) {
  ["dashboard","generator","keys","stock","settings"].forEach(p=>{
    let el = document.getElementById(p+"Page");
    if (el) el.classList.add("hidden");
  });

  document.getElementById(page+"Page").classList.remove("hidden");
}

// KEYS
function generateKey() {
  let key = "WOAH-" + Math.random().toString(36).substring(2,10).toUpperCase();
  let keys = JSON.parse(localStorage.getItem("keys") || "[]");
  keys.push({ code: key, used: false });
  localStorage.setItem("keys", JSON.stringify(keys));
  alert("Key: " + key);
}

function redeemKey() {
  let input = document.getElementById("keyInput2").value;
  let keys = JSON.parse(localStorage.getItem("keys") || "[]");

  let found = keys.find(k => k.code === input && !k.used);

  if (found) {
    found.used = true;
    localStorage.setItem("keys", JSON.stringify(keys));
    localStorage.setItem("unlocked", "true");

    document.getElementById("lockedBox").classList.add("hidden");
    document.getElementById("genBox").classList.remove("hidden");

    alert("Unlocked!");
  } else {
    alert("Invalid or used key");
  }
}

// STOCK
function saveStock() {
  let stock = document.getElementById("stock").value;
  localStorage.setItem("stock", stock);
  alert("Stock saved");
}

// GENERATOR
function generateAccount() {
  if (localStorage.getItem("unlocked") !== "true") return alert("Redeem key first");

  let stock = localStorage.getItem("stock");
  if (!stock || stock.trim() === "") return alert("No stock");

  let lines = stock.split("\n");
  let acc = lines.shift();

  localStorage.setItem("stock", lines.join("\n"));
  document.getElementById("result").innerText = acc;

  let total = parseInt(localStorage.getItem("generated") || "0");
  total++;
  localStorage.setItem("generated", total);
  document.getElementById("totalGen").innerText = total;
}

// PASSWORD
function changePassword() {
  let oldPass = document.getElementById("oldPass").value;
  let newPass = document.getElementById("newPass").value;

  if (admin === "true") {
    let saved = localStorage.getItem("adminPass");

    if (oldPass === saved) {
      localStorage.setItem("adminPass", newPass);
      alert("Admin password updated");
    } else {
      alert("Wrong password");
    }
  } else {
    let email = localStorage.getItem("loggedIn");
    let user = JSON.parse(localStorage.getItem(email));

    if (user.password === oldPass) {
      user.password = newPass;
      localStorage.setItem(email, JSON.stringify(user));
      alert("Password updated");
    } else {
      alert("Wrong password");
    }
  }
}

function logout() {
  localStorage.removeItem("loggedIn");
  localStorage.removeItem("admin");
  window.location.href = "login.html";
}
</script>

</body>
</html>
