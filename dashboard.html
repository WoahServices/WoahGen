<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WoahGen Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: radial-gradient(circle at top, #0b0f1a, #000);
}

.sidebar {
  background: rgba(7,13,24,0.9);
  backdrop-filter: blur(10px);
}

.card {
  background: rgba(17,24,39,0.85);
  backdrop-filter: blur(12px);
  border-radius: 16px;
}

.logo {
  font-size: 22px;
  font-weight: 900;
  background: linear-gradient(90deg,#00ccff,#00ff88);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
</style>
</head>

<body class="text-white flex">

<!-- SIDEBAR -->
<div class="sidebar w-64 h-screen p-5 flex flex-col">

<h1 class="logo mb-6">WOAHGEN</h1>

<button onclick="showPage('dashboard')" class="p-2 bg-purple-600 rounded mb-2">Dashboard</button>
<button onclick="showPage('generator')" class="p-2 hover:bg-white/10 rounded">Generator</button>

<div class="mt-auto">
<button onclick="logout()" class="bg-red-500 w-full p-2 rounded">Logout</button>
</div>

</div>

<!-- MAIN -->
<div class="flex-1 p-8">

<!-- DASHBOARD -->
<div id="dashboardPage">

<h1 class="text-3xl mb-6">Dashboard</h1>

<div class="grid grid-cols-3 gap-6">

<div class="card p-5">
<p class="text-gray-400 text-sm">Status</p>
<p id="statusText" class="text-red-400 text-xl">Locked</p>
</div>

<div class="card p-5">
<p class="text-gray-400 text-sm">Account</p>
<p id="userEmail" class="text-green-400 text-sm">Loading...</p>
</div>

<div class="card p-5">
<p class="text-gray-400 text-sm">Access</p>
<p id="accessType" class="text-purple-400">FREE</p>
</div>

</div>

</div>

<!-- GENERATOR -->
<div id="generatorPage" class="hidden">

<h1 class="text-3xl mb-6">Generator</h1>

<div class="card p-6 max-w-md">

<!-- LOCKED -->
<div id="lockedBox">

<p class="text-center text-gray-400 mb-3">🔒 Generator Locked</p>

<a href="https://woahservices.mysellauth.com/" target="_blank">
<button class="w-full bg-yellow-500 text-black font-bold p-2 rounded mb-3">
💳 Buy Key
</button>
</a>

<input id="keyInput" placeholder="WOAH-GEN-XXXX" class="w-full p-3 bg-black rounded mb-3">

<button onclick="redeemKey()" class="w-full bg-purple-600 p-2 rounded">
Unlock Generator
</button>

</div>

<!-- UNLOCKED -->
<div id="genBox" class="hidden">

<select id="stockType" class="w-full p-2 bg-black rounded mb-3">
<option value="normal">Normal</option>
<option value="unchecked">Unchecked</option>
<option value="hq">HQ</option>
</select>

<button onclick="generate()" class="w-full bg-green-500 p-3 rounded">
Generate
</button>

<p id="output" class="mt-4 text-green-400"></p>

</div>

</div>

</div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDfxC5dTsrIUZsutHZhsbWnN9hLnmITB2o",
  authDomain:"woahgen-602ae.firebaseapp.com",
  projectId:"woahgen-602ae"
});

const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

// ✅ FIXED AUTH (NO LOOP)
onAuthStateChanged(auth, async (user)=>{
  if(!user){
    return location.href = "login.html";
  }

  if(user.email === "pattonayinde27@gmail.com"){
    return location.href = "admin-dashboard.html";
  }

  currentUser = user;

  document.getElementById("userEmail").innerText = user.email;

  const ref = doc(db,"users",user.uid);
  const snap = await getDoc(ref);

  if(snap.exists() && snap.data().unlocked){
    unlockUI();
  }
});

// NAV
window.showPage = (p)=>{
  ["dashboard","generator"].forEach(x=>{
    document.getElementById(x+"Page").classList.add("hidden");
  });
  document.getElementById(p+"Page").classList.remove("hidden");
};

// 🔑 REDEEM FIXED
window.redeemKey = async ()=>{
  let key = document.getElementById("keyInput").value.trim().toUpperCase();

  const ref = doc(db,"keys",key);
  const snap = await getDoc(ref);

  if(!snap.exists() || snap.data().used){
    return alert("Invalid or used key");
  }

  await updateDoc(ref,{used:true});

  await setDoc(doc(db,"users",currentUser.uid),{
    unlocked:true
  },{merge:true});

  unlockUI();
};

// 🔓 UI
function unlockUI(){
  document.getElementById("lockedBox").classList.add("hidden");
  document.getElementById("genBox").classList.remove("hidden");

  document.getElementById("statusText").innerText = "Unlocked";
  document.getElementById("statusText").classList.remove("text-red-400");
  document.getElementById("statusText").classList.add("text-green-400");

  document.getElementById("accessType").innerText = "PREMIUM";
}

// ⚡ GENERATOR
window.generate = async ()=>{
  let type = document.getElementById("stockType").value;

  const ref = doc(db,"stock","main");
  const snap = await getDoc(ref);

  let data = snap.data();
  let list = data[type] || [];

  if(list.length === 0){
    return alert("Out of stock");
  }

  let acc = list[0];
  list.shift();

  await updateDoc(ref,{[type]: list});

  document.getElementById("output").innerText = acc;
};

// LOGOUT
window.logout = ()=>{
  signOut(auth).then(()=>{
    location.href = "login.html";
  });
};
</script>

</body>
</html>
