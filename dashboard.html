<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b0f1a] text-white p-10">

<h1 class="text-3xl mb-6">Dashboard</h1>

<p id="user"></p>

<button onclick="logout()" class="bg-red-500 p-2 mt-4 rounded">Logout</button>

<script>
let user = localStorage.getItem("loggedIn");
let admin = localStorage.getItem("admin");

if (!user && !admin) {
  window.location.href = "login.html";
}

document.getElementById("user").innerText =
  admin ? "Logged in as ADMIN" : "Logged in as: " + user;

function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}
</script>

</body>
</html>
