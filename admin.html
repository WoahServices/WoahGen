<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - WoahGen</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: radial-gradient(circle at top, #0b0f1a, #000);
  overflow: hidden;
}

.woah-text {
  font-size: 40px;
  font-weight: 900;
  background: linear-gradient(90deg, #00ccff, #00ff88);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.glow-purple {
  text-shadow: 0 0 10px #a855f7;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}
</style>
</head>

<body class="flex items-center justify-center h-screen text-white">

<canvas id="matrix"></canvas>

<div class="bg-[#111827]/90 backdrop-blur p-8 rounded-xl w-96 border border-purple-500/30">

<h1 class="woah-text text-center mb-4">WOAH SERVICES</h1>
<h2 class="text-xl mb-6 text-center glow-purple">Admin Access</h2>

<input id="adminEmail" placeholder="Admin Email"
class="w-full p-3 mb-3 bg-[#0b0f1a] rounded outline-none">

<input id="adminPass" type="password" placeholder="Admin Password"
class="w-full p-3 mb-4 bg-[#0b0f1a] rounded outline-none">

<button id="loginBtn" onclick="adminLogin()"
class="w-full bg-purple-600 p-3 rounded hover:scale-105 transition">
Login as Admin
</button>

<p class="text-sm text-gray-400 mt-4 text-center">
<a href="login.html" class="text-green-400">Back to User Login</a>
</p>

</div>

<!-- 🔐 FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyDfxC5dTsrIUZsutHZhsbWnN9hLnmITB2o",
  authDomain: "woahgen-602ae.firebaseapp.com",
  projectId: "woahgen-602ae"
});

const auth = getAuth(app);

let loading = false;

// 🔐 ADMIN LOGIN
window.adminLogin = async function() {

  if (loading) return;
  loading = true;

  const btn = document.getElementById("loginBtn");
  btn.innerText = "Logging in...";

  let email = document.getElementById("adminEmail").value.trim().toLowerCase();
  let pass = document.getElementById("adminPass").value.trim();

  if (!email || !pass) {
    alert("Fill all fields");
    reset();
    return;
  }

  // 🔒 ONLY YOU
  if (email !== "pattonayinde27@gmail.com") {
    alert("Not authorized");
    reset();
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, pass);

    // ✅ CLEAN REDIRECT
    window.location.replace("admin-dashboard.html");

  } catch (err) {
    alert(err.message); // shows real Firebase error
    reset();
  }
};

// RESET BUTTON
function reset(){
  loading = false;
  document.getElementById("loginBtn").innerText = "Login as Admin";
}

</script>

<!-- MATRIX -->
<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01WOAH";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = [];

for (let i = 0; i < columns; i++) drops[i] = 1;

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ff88";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    let text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.97)
      drops[i] = 0;

    drops[i]++;
  }
}

setInterval(draw, 30);
</script>

</body>
</html>
