<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - WoahGen</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: radial-gradient(circle at top, #0b0f1a, #000);
  overflow: hidden;
}

.woah-text {
  font-size: 40px;
  font-weight: 900;
  background: linear-gradient(90deg, #00ccff, #00ff88);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow:
    0 0 10px #00ccff,
    0 0 20px #00ff88,
    0 0 40px #00ff88;
}

.glow-purple {
  text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}
</style>
</head>

<body class="flex items-center justify-center h-screen text-white">

<!-- MATRIX -->
<canvas id="matrix"></canvas>

<!-- ADMIN BOX -->
<div class="bg-[#111827]/90 backdrop-blur p-8 rounded-xl w-96 shadow-lg border border-purple-500/30">

<h1 class="woah-text text-center mb-4">WOAH SERVICES</h1>

<h2 class="text-xl mb-6 text-center glow-purple">Admin Access</h2>

<input id="adminEmail" placeholder="Admin Email"
class="w-full p-3 mb-3 bg-[#0b0f1a] rounded outline-none">

<input id="adminPass" type="password" placeholder="Admin Password"
class="w-full p-3 mb-4 bg-[#0b0f1a] rounded outline-none">

<button onclick="adminLogin()"
class="w-full bg-purple-600 p-3 rounded hover:scale-105 transition">
Login as Admin
</button>

<p class="text-sm text-gray-400 mt-4 text-center">
<a href="login.html" class="text-green-400">Back to Login</a>
</p>

</div>

<!-- ADMIN SCRIPT -->
<script>

// 🔐 SET DEFAULT PASSWORD (ONLY FIRST TIME)
if (!localStorage.getItem("adminPass")) {
  localStorage.setItem("adminPass", "woah$admin2327!");
}

function adminLogin() {
  let email = document.getElementById("adminEmail").value.trim();
  let pass = document.getElementById("adminPass").value.trim();

  let savedPass = localStorage.getItem("adminPass");

  // 🚫 empty check
  if (!email || !pass) {
    alert("Fill all fields");
    return;
  }

  // 🔐 admin check
  if (email === "pattonayinde27@gmail.com") {
    if (pass === savedPass) {
      localStorage.setItem("admin", "true");
      localStorage.removeItem("loggedIn");
      window.location.href = "dashboard.html";
    } else {
      alert("Wrong admin password");
    }
  } else {
    alert("Not authorized");
  }
}
</script>

<!-- MATRIX SCRIPT -->
<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01WOAH";
const fontSize = 14;
const columns = canvas.width / fontSize;

const drops = [];

for (let x = 0; x < columns; x++) drops[x] = 1;

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ff88";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters.charAt(Math.floor(Math.random() * letters.length));
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
      drops[i] = 0;

    drops[i]++;
  }
}

setInterval(draw, 33);
</script>

</body>
</html>
