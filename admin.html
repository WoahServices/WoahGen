<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center h-screen bg-black text-white">

<div class="bg-[#111827] p-8 rounded-xl w-96 border border-purple-500">

<h1 class="text-2xl mb-6 text-center text-purple-400">Admin Login</h1>

<input id="adminPass" type="password" placeholder="Admin Password"
class="w-full p-3 mb-4 bg-black rounded">

<button onclick="adminLogin()" class="w-full bg-purple-600 p-3 rounded">
Login
</button>

</div>

<script>
function adminLogin() {
  let pass = document.getElementById("adminPass").value;

  if (pass === "woahadmin123") {
    localStorage.setItem("admin", "true");
    window.location.href = "dashboard.html";
  } else {
    alert("Wrong password");
  }
}
</script>

</body>
</html>
