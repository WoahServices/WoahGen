<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WoahGen Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background: #050a14; }

.card {
  background: #0b1220;
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 16px;
}

.sidebar { background: #070d18; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb {
  background: #7c3aed;
  border-radius: 10px;
}
</style>
</head>

<body class="text-white flex">

<!-- SIDEBAR -->
<div class="sidebar w-64 h-screen p-5 flex flex-col overflow-y-auto">

<h1 class="text-xl font-bold mb-6 text-purple-400">WoahGen</h1>

<button onclick="showPage('dashboard')" class="p-2 bg-purple-600 rounded mb-1">Dashboard</button>
<button onclick="showPage('generator')" class="p-2 hover:bg-[#111827] rounded">Generator</button>

<button id="adminStockBtn" onclick="showPage('stock')" class="p-2 hover:bg-[#111827] rounded hidden">Stock</button>

<div class="mt-auto">
<button onclick="logout()" class="bg-red-500 w-full p-2 rounded mt-6">Logout</button>
</div>

</div>

<!-- MAIN -->
<div class="flex-1 p-6 overflow-y-auto h-screen">

<div id="dashboardPage">
<h1 class="text-3xl mb-6">Dashboard</h1>
</div>

<div id="generatorPage" class="hidden">

<h1 class="text-3xl mb-6">Account Generator</h1>

<div class="grid grid-cols-4 gap-4 mb-6">
<div class="card p-4">
<p class="text-gray-400">Total Generated</p>
<h2 id="totalGen" class="text-2xl">0</h2>
</div>
<div class="card p-4"><p class="text-gray-400">This Month</p><h2>0</h2></div>
<div class="card p-4"><p class="text-gray-400">This Week</p><h2>0</h2></div>
<div class="card p-4"><p class="text-gray-400">Today</p><h2>0</h2></div>
</div>

<div class="grid grid-cols-2 gap-6">

<div class="card p-6">

<h2 class="mb-4 text-lg">Generate Account</h2>

<div id="lockedBox">
<p class="text-gray-400 mb-3">Generator Locked</p>
<input id="keyInput" class="w-full p-3 bg-black rounded mb-3">
<button onclick="redeemKey()" class="w-full bg-purple-600 p-2 rounded">Unlock</button>
</div>

<div id="genBox" class="hidden">
<div class="space-y-3 mb-4">

<button onclick="selectType('normal')" class="w-full p-3 bg-[#111827] rounded flex justify-between">
Normal <span id="normalCount">0</span>
</button>

<button onclick="selectType('unchecked')" class="w-full p-3 bg-[#111827] rounded flex justify-between">
Unchecked <span id="uncheckedCount">0</span>
</button>

<button onclick="selectType('hq')" class="w-full p-3 bg-[#111827] rounded flex justify-between">
HQ <span id="hqCount">0</span>
</button>

</div>

<button onclick="generate()" class="w-full bg-green-500 p-3 rounded">Generate</button>
</div>

</div>

<div class="card p-6">
<h2 class="mb-4 text-lg">Account Details</h2>
<p id="output" class="text-green-400">Select an account</p>
</div>

</div>
</div>

<div id="stockPage" class="hidden">
<h1 class="text-3xl mb-6">Stock</h1>

<div class="card p-6">
<select id="stockType" class="w-full p-3 bg-black rounded mb-3">
<option value="normal">Normal</option>
<option value="unchecked">Unchecked</option>
<option value="hq">HQ</option>
</select>

<textarea id="stockInput" class="w-full h-40 bg-black p-3 rounded mb-4"></textarea>

<button onclick="addStock()" class="bg-purple-600 px-6 py-2 rounded">Add Stock</button>
</div>
</div>

</div>

<!-- 🔐 FIREBASE SECURITY -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDfxC5dTsrIUZsutHZhsbWnN9hLnmITB2o",
  authDomain: "woahgen-602ae.firebaseapp.com",
  projectId: "woahgen-602ae",
  storageBucket: "woahgen-602ae.firebasestorage.app",
  messagingSenderId: "484403134603",
  appId: "1:484403134603:web:177a61bacc055f4077d48e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🚫 BLOCK UNAUTHORIZED USERS
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
  }
});

// 👑 ADMIN UI
if (localStorage.getItem("admin") === "true") {
  document.getElementById("adminStockBtn").classList.remove("hidden");
}

// NAV
window.showPage = function(page) {
  ["dashboard","generator","stock"].forEach(p=>{
    document.getElementById(p+"Page").classList.add("hidden");
  });
  document.getElementById(page+"Page").classList.remove("hidden");
};

// KEY SYSTEM (TEMP)
window.redeemKey = function() {
  let key = document.getElementById("keyInput").value;

  if (key.startsWith("WOAH-GEN-")) {
    localStorage.setItem("unlocked", "true");
    document.getElementById("lockedBox").classList.add("hidden");
    document.getElementById("genBox").classList.remove("hidden");
  } else {
    alert("Invalid key");
  }
};

// AUTO UNLOCK
if (localStorage.getItem("unlocked") === "true") {
  setTimeout(()=>{
    document.getElementById("lockedBox").classList.add("hidden");
    document.getElementById("genBox").classList.remove("hidden");
  },100);
}

// STOCK
function getStock() {
  return JSON.parse(localStorage.getItem("stockObj")) || {normal:[],unchecked:[],hq:[]};
}
function saveStock(s) { localStorage.setItem("stockObj", JSON.stringify(s)); }

window.addStock = function() {
  let type = document.getElementById("stockType").value;
  let lines = document.getElementById("stockInput").value.split("\n");

  let stock = getStock();
  stock[type] = stock[type].concat(lines);
  saveStock(stock);

  updateCounts();
  alert("Stock added!");
};

function updateCounts() {
  let s = getStock();
  document.getElementById("normalCount").innerText = s.normal.length;
  document.getElementById("uncheckedCount").innerText = s.unchecked.length;
  document.getElementById("hqCount").innerText = s.hq.length;
}

setTimeout(updateCounts, 200);

// GENERATOR
let selectedType = "normal";
window.selectType = (t)=> selectedType = t;

window.generate = function() {
  let stock = getStock();
  let list = stock[selectedType];

  if (!list.length) return alert("No stock");

  let acc = list.shift();
  saveStock(stock);

  document.getElementById("output").innerText = acc;

  let total = localStorage.getItem("totalGen") || 0;
  total++;
  localStorage.setItem("totalGen", total);
  document.getElementById("totalGen").innerText = total;

  updateCounts();
};

// LOGOUT (REAL)
window.logout = function() {
  signOut(auth);
  localStorage.clear();
  window.location.href = "login.html";
};

</script>

</body>
</html>
