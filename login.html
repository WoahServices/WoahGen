<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - WoahGen</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#070b14; overflow:hidden; }

.logo {
  font-size:38px;
  font-weight:900;
  background:linear-gradient(90deg,#00ccff,#00ff88);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.card {
  background:rgba(17,24,39,0.85);
  backdrop-filter:blur(12px);
}

canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}
</style>
</head>

<body class="flex items-center justify-center h-screen text-white">

<canvas id="matrix"></canvas>

<div class="card p-8 rounded-2xl w-96">

<h1 class="logo text-center mb-4">WOAH SERVICES</h1>

<input id="email" placeholder="Email" class="w-full p-3 mb-3 bg-black/50 rounded">
<input id="password" type="password" placeholder="Password" class="w-full p-3 mb-4 bg-black/50 rounded">

<button onclick="login()" class="w-full bg-gradient-to-r from-blue-500 to-green-400 p-3 rounded">
Login
</button>

<div class="mt-4 flex gap-2">
<button onclick="location.href='signup.html'" class="w-1/2 bg-green-500 p-2 rounded">Sign Up</button>
<button onclick="location.href='admin.html'" class="w-1/2 bg-purple-600 p-2 rounded">Admin</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const app = initializeApp({
  apiKey:"AIzaSyDfxC5dTsrIUZsutHZhsbWnN9hLnmITB2o",
  authDomain:"woahgen-602ae.firebaseapp.com",
  projectId:"woahgen-602ae"
});

const auth = getAuth(app);

// ✅ PREVENT MULTIPLE REDIRECTS
let redirected = false;

// AUTO REDIRECT
onAuthStateChanged(auth, (user)=>{
  if(user && !redirected){
    redirected = true;

    if(user.email === "pattonayinde27@gmail.com"){
      window.location.href = "admin-dashboard.html";
    } else {
      window.location.href = "dashboard.html";
    }
  }
});

// LOGIN
window.login = async function(){
  let email = document.getElementById("email").value.trim().toLowerCase();
  let pass = document.getElementById("password").value.trim();

  if(!email || !pass){
    alert("Fill all fields");
    return;
  }

  try {
    let res = await signInWithEmailAndPassword(auth,email,pass);

    if(res.user.email === "pattonayinde27@gmail.com"){
      window.location.href = "admin-dashboard.html";
    } else {
      window.location.href = "dashboard.html";
    }

  } catch (err) {
    alert("Login failed");
  }
};
</script>

<!-- MATRIX EFFECT -->
<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01WOAH";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = [];

for (let i = 0; i < columns; i++) drops[i] = 1;

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ff88";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    let text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.97)
      drops[i] = 0;

    drops[i]++;
  }
}

setInterval(draw, 30);
</script>

</body>
</html>
