<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WoahGen</title>
  <style>
    body {
      background: black;
      color: #00ff88;
      font-family: Arial;
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      font-size: 50px;
      text-shadow: 0 0 20px #00ff88;
    }

    button {
      padding: 15px 30px;
      background: #00ff88;
      border: none;
      color: black;
      font-size: 18px;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 0 0 20px #00ff88;
    }

    .box {
      margin-top: 30px;
      font-size: 20px;
    }
  </style>
</head>
<body>

<h1>WoahGen</h1>
<p>Generate your account instantly</p>

<button onclick="gen()">Generate</button>

<div class="box" id="output"></div>

<script>
function gen() {
  const output = document.getElementById("output");
  output.innerHTML = "Generating...";

  setTimeout(() => {
    output.innerHTML =
      "Username: user" + Math.floor(Math.random()*9999) +
      "<br>Password: pass" + Math.floor(Math.random()*9999);
  }, 2000);
}
</script>

</body>
</html>
