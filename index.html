<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WoahGen</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b0f1a] text-white">

<div class="flex">

  <!-- Sidebar -->
  <div class="w-64 h-screen bg-[#0f172a] p-4">
    <h1 class="text-xl font-bold mb-6 text-purple-400">WoahGen</h1>

    <div class="space-y-3">
      <button class="block w-full text-left p-2 bg-purple-600 rounded">Dashboard</button>
      <button class="block w-full text-left p-2 hover:bg-gray-700 rounded">Generator</button>
      <button class="block w-full text-left p-2 hover:bg-gray-700 rounded">Keys</button>
      <button class="block w-full text-left p-2 hover:bg-gray-700 rounded">Stock</button>
    </div>
  </div>

  <!-- Main -->
  <div class="flex-1 p-8">

    <h1 class="text-3xl font-bold mb-4">Account Generator</h1>

    <div class="bg-[#111827] p-8 rounded-xl text-center">
      <h2 class="text-xl mb-2">Account stock is locked</h2>
      <p class="text-gray-400 mb-4">
        Redeem a key to unlock generator
      </p>

      <button class="bg-purple-600 px-6 py-2 rounded hover:bg-purple-500">
        Redeem Key
      </button>
    </div>

  </div>

</div>

</body>
</html>
