<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WoahGen Admin</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#050a14; }
.sidebar { background:#070d18; }
.card { background:#0b1220; border-radius:16px; }
.logo {
  font-size:20px;
  font-weight:900;
  background:linear-gradient(90deg,#00ccff,#00ff88);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
</style>
</head>

<body class="flex text-white">

<!-- SIDEBAR -->
<div class="sidebar w-64 h-screen p-5 flex flex-col">

<h1 class="logo mb-6">WOAHGEN ADMIN</h1>

<p class="text-gray-500 text-xs mb-2 uppercase">Admin</p>

<button onclick="showPage('overview')" class="p-2 hover:bg-white/10 rounded">Overview</button>
<button onclick="showPage('keys')" class="p-2 hover:bg-white/10 rounded">Keys</button>
<button onclick="showPage('stock')" class="p-2 hover:bg-white/10 rounded">Stock</button>

<div class="mt-auto">
<button onclick="logout()" class="bg-red-500 w-full p-2 rounded mt-6">Logout</button>
</div>

</div>

<!-- MAIN -->
<div class="flex-1 p-6">

<!-- OVERVIEW -->
<div id="overviewPage">
<h1 class="text-3xl mb-6">Admin Overview</h1>
<p class="text-gray-400">Manage your SaaS system 🔥</p>
</div>

<!-- KEYS -->
<div id="keysPage" class="hidden">

<h1 class="text-3xl mb-6">Key Manager</h1>

<div class="card p-6 mb-6">
<button onclick="createKey()" class="bg-purple-600 px-6 py-2 rounded mb-4">
Generate Key
</button>

<p id="newKey" class="text-green-400"></p>
</div>

<div class="card p-6">
<h2 class="mb-3">All Keys</h2>
<div id="keyList" class="space-y-2 text-sm"></div>
</div>

</div>

<!-- STOCK -->
<div id="stockPage" class="hidden">

<h1 class="text-3xl mb-6">Stock Manager</h1>

<div class="card p-6">

<textarea id="stockInput" class="w-full h-40 bg-black p-3 rounded mb-4" placeholder="user:pass"></textarea>

<select id="stockType" class="w-full p-2 bg-black rounded mb-3">
<option value="normal">Normal</option>
<option value="unchecked">Unchecked</option>
<option value="hq">HQ</option>
</select>

<button onclick="addStock()" class="bg-purple-600 px-6 py-2 rounded">
Add Stock
</button>

</div>

</div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDfxC5dTsrIUZsutHZhsbWnN9hLnmITB2o",
  authDomain:"woahgen-602ae.firebaseapp.com",
  projectId:"woahgen-602ae"
});

const auth = getAuth(app);
const db = getFirestore(app);

// 🔐 AUTH
onAuthStateChanged(auth, (user)=>{
  if(!user) return location.href="login.html";
  if(user.email !== "pattonayinde27@gmail.com"){
    return location.href="dashboard.html";
  }
});

// NAV
window.showPage = (page)=>{
  ["overview","keys","stock"].forEach(p=>{
    document.getElementById(p+"Page").classList.add("hidden");
  });

  document.getElementById(page+"Page").classList.remove("hidden");

  if(page === "keys") loadKeys();
};

// DEFAULT PAGE
showPage("overview");

// 🔑 BETTER KEY GENERATOR
window.createKey = async ()=>{
  let key = "WOAH-GEN-" + Math.random().toString(36).substring(2,8).toUpperCase();

  await setDoc(doc(db,"keys",key),{
    used:false,
    createdAt:Date.now()
  });

  document.getElementById("newKey").innerText = key;
  loadKeys();
};

// 🔑 LOAD KEYS
async function loadKeys(){
  const snapshot = await getDocs(collection(db,"keys"));
  const list = document.getElementById("keyList");

  list.innerHTML = "";

  snapshot.forEach(docSnap=>{
    let data = docSnap.data();

    let div = document.createElement("div");
    div.className = "flex justify-between items-center bg-black/40 p-2 rounded";

    div.innerHTML = `
      <span class="${data.used ? 'text-red-400' : 'text-green-400'}">
        ${docSnap.id} ${data.used ? "(USED)" : "(ACTIVE)"}
      </span>
      <div class="flex gap-2">
        <button onclick="copyKey('${docSnap.id}')" class="text-blue-400">Copy</button>
        <button onclick="deleteKey('${docSnap.id}')" class="text-red-400">Delete</button>
      </div>
    `;

    list.appendChild(div);
  });
}

// COPY
window.copyKey = (key)=>{
  navigator.clipboard.writeText(key);
  alert("Copied: " + key);
};

// DELETE
window.deleteKey = async (key)=>{
  await deleteDoc(doc(db,"keys",key));
  loadKeys();
};

// 📦 STOCK
window.addStock = async ()=>{
  let type = document.getElementById("stockType").value;

  let lines = document.getElementById("stockInput").value
    .split("\n")
    .map(x=>x.trim())
    .filter(x=>x);

  if(!lines.length) return alert("No stock");

  const ref = doc(db,"stock","main");
  const snap = await getDoc(ref);

  let data = snap.exists() ? snap.data() : { normal:[], unchecked:[], hq:[] };

  data[type] = data[type].concat(lines);

  await setDoc(ref,data);

  alert("Stock added successfully");
};

// LOGOUT
window.logout = ()=>{
  signOut(auth).then(()=>location.href="login.html");
};
</script>

</body>
</html>
