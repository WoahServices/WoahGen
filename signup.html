<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up - WoahGen</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: radial-gradient(circle at top, #0b0f1a, #000);
  overflow: hidden;
}

.woah-text {
  font-size: 40px;
  font-weight: 900;
  background: linear-gradient(90deg, #00ccff, #00ff88);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}
</style>
</head>

<body class="flex items-center justify-center h-screen text-white">

<canvas id="matrix"></canvas>

<div class="bg-[#111827]/90 backdrop-blur p-8 rounded-xl w-96 border border-green-500/20">

<h1 class="woah-text text-center mb-4">WOAH SERVICES</h1>
<h2 class="text-xl mb-6 text-center">Create Account</h2>

<input id="email" placeholder="Email"
class="w-full p-3 mb-3 bg-[#0b0f1a] rounded outline-none">

<input id="password" type="password" placeholder="Password"
class="w-full p-3 mb-3 bg-[#0b0f1a] rounded outline-none">

<button id="signupBtn" onclick="signup()"
class="w-full bg-gradient-to-r from-blue-500 to-green-400 p-3 rounded">
Sign Up
</button>

<p class="text-sm text-gray-400 mt-4 text-center">
Already have an account?
<a href="login.html" class="text-green-400">Login</a>
</p>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDfxC5dTsrIUZsutHZhsbWnN9hLnmITB2o",
  authDomain: "woahgen-602ae.firebaseapp.com",
  projectId: "woahgen-602ae"
});

const auth = getAuth(app);
const db = getFirestore(app);

let loading = false;

// SIGNUP
window.signup = async function () {

  if (loading) return;
  loading = true;

  const btn = document.getElementById("signupBtn");
  btn.innerText = "Creating...";

  let email = document.getElementById("email").value.trim().toLowerCase();
  let password = document.getElementById("password").value.trim();

  if (email === "pattonayinde27@gmail.com") {
    alert("This email is reserved.");
    reset();
    return;
  }

  if (!email || !password) {
    alert("Fill all fields");
    reset();
    return;
  }

  if (!email.includes("@") || email.length < 5) {
    alert("Enter a valid email");
    reset();
    return;
  }

  if (password.length < 6) {
    alert("Password must be at least 6 characters");
    reset();
    return;
  }

  try {
    const res = await createUserWithEmailAndPassword(auth, email, password);

    // ✅ CREATE USER DATA (MATCHES YOUR DASHBOARD)
    await setDoc(doc(db, "users", res.user.uid), {
      plan: "free",
      createdAt: Date.now()
    });

    alert("Account created!");

    // 🚀 CLEAN REDIRECT
    window.location.replace("login.html");

  } catch (err) {
    alert(err.message);
    reset();
  }
};

// RESET BUTTON
function reset(){
  loading = false;
  document.getElementById("signupBtn").innerText = "Sign Up";
}

</script>

<!-- MATRIX -->
<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01WOAH";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = [];

for (let i = 0; i < columns; i++) drops[i] = 1;

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ff88";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    let text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.97)
      drops[i] = 0;

    drops[i]++;
  }
}

setInterval(draw, 30);
</script>

</body>
</html>
