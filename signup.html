<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up - WoahGen</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: radial-gradient(circle at top, #0b0f1a, #000);
  overflow: hidden;
}

.woah-text {
  font-size: 40px;
  font-weight: 900;
  background: linear-gradient(90deg, #00ccff, #00ff88);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow:
    0 0 10px #00ccff,
    0 0 20px #00ff88,
    0 0 40px #00ff88;
}

.glow {
  text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}
</style>
</head>

<body class="flex items-center justify-center h-screen text-white">

<canvas id="matrix"></canvas>

<div class="bg-[#111827]/90 backdrop-blur p-8 rounded-xl w-96 shadow-lg border border-green-500/20">

<h1 class="woah-text text-center mb-4">WOAH SERVICES</h1>

<h2 class="text-xl mb-6 text-center glow">Create Account</h2>

<input id="email" placeholder="Email"
class="w-full p-3 mb-3 bg-[#0b0f1a] rounded outline-none">

<input id="password" type="password" placeholder="Password"
class="w-full p-3 mb-3 bg-[#0b0f1a] rounded outline-none">

<button onclick="signup()"
class="w-full bg-gradient-to-r from-blue-500 to-green-400 p-3 rounded hover:scale-105 transition">
Sign Up
</button>

<p class="text-sm text-gray-400 mt-4 text-center">
Already have an account?
<a href="login.html" class="text-green-400">Login</a>
</p>

</div>

<!-- 🔥 FIREBASE SIGNUP -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDfxC5dTsrIUZsutHZhsbWnN9hLnmITB2o",
  authDomain: "woahgen-602ae.firebaseapp.com",
  projectId: "woahgen-602ae",
  storageBucket: "woahgen-602ae.firebasestorage.app",
  messagingSenderId: "484403134603",
  appId: "1:484403134603:web:177a61bacc055f4077d48e",
  measurementId: "G-JC2NL3JS69"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// SIGNUP FUNCTION
window.signup = async function () {

  let email = document.getElementById("email").value.trim().toLowerCase();
  let password = document.getElementById("password").value.trim();

  if (email === "pattonayinde27@gmail.com") {
    alert("This email is reserved.");
    return;
  }

  if (!email || !password) {
    alert("Fill all fields");
    return;
  }

  if (!email.includes("@")) {
    alert("Enter a valid email");
    return;
  }

  if (password.length < 4) {
    alert("Password must be at least 4 characters");
    return;
  }

  try {
    await createUserWithEmailAndPassword(auth, email, password);
    alert("Account created!");
    window.location.href = "login.html";
  } catch (err) {
    alert(err.message);
  }

};

</script>

<!-- MATRIX -->
<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01WOAH";
const fontSize = 14;
const columns = canvas.width / fontSize;

const drops = [];

for (let i = 0; i < columns; i++) drops[i] = 1;

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ff88";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    let text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.97)
      drops[i] = 0;

    drops[i]++;
  }
}

setInterval(draw, 30);
</script>

</body>
</html>
