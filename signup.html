<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up - WoahGen</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center h-screen bg-[#0b0f1a] text-white">

<div class="bg-[#111827] p-8 rounded-xl w-96">

<h1 class="text-2xl mb-6 text-center">Create Account</h1>

<input id="email" placeholder="Email" class="w-full p-3 mb-3 bg-black rounded">
<input id="password" type="password" placeholder="Password" class="w-full p-3 mb-3 bg-black rounded">

<button onclick="signup()" class="w-full bg-green-500 p-3 rounded">Sign Up</button>

</div>

<script>
function signup() {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  localStorage.setItem(email, JSON.stringify({password}));

  alert("Account created!");
  window.location.href = "login.html";
}
</script>

</body>
</html>
